<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contributors Widget Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6 font-sans">
  <div class="max-w-3xl mx-auto space-y-6">

    <header class="border-b border-gray-800 pb-4">
      <h1 class="text-2xl font-bold text-white">GitHub Contributors Widget Setup</h1>
      <p class="text-sm text-gray-400">Configure your repository widget and copy the embed code.</p>
    </header>

    <!-- Configuration Panel -->
    <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
      
      <!-- Repository Input -->
      <div>
        <label class="block text-sm font-medium mb-1">GitHub Repository</label>
        <input type="text" id="input-repo" value="facebook/react" placeholder="owner/repo or https://github.com/owner/repo" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Theme Swapper -->
        <div>
          <label class="block text-sm font-medium mb-1">Theme</label>
          <select id="select-theme" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <option value="dark">GitHub Dark</option>
            <option value="light">GitHub Light</option>
            <option value="dracula">Dracula</option>
            <option value="nord">Nord</option>
          </select>
        </div>

        <!-- Language Picker -->
        <div>
          <label class="block text-sm font-medium mb-1">Language</label>
          <select id="select-lang" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
          </select>
        </div>
      </div>

    </div>

    <!-- Live Preview -->
    <div class="bg-gray-900 p-6 rounded-xl border border-gray-800">
      <h2 class="text-sm font-medium mb-3 text-gray-400">Preview</h2>
      <div id="preview-container" class="min-h-[100px] flex items-center justify-center border border-dashed border-gray-800 rounded-lg p-4"></div>
    </div>

    <!-- Output Code Snippet -->
    <div class="bg-gray-900 p-6 rounded-xl border border-gray-800">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-medium text-gray-400">Embed Code</h2>
        <button id="copy-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-1.5 rounded-md transition-colors">Copy Code</button>
      </div>
      <pre class="bg-gray-950 border border-gray-800 rounded-lg p-3 text-xs text-green-400 overflow-x-auto"><code id="code-output"></code></pre>
    </div>

  </div>

  <script>
    // Host URL where your widget.js script is stored
    const SCRIPT_URL = "https://your-domain.com/widget.js";

    const repoInput = document.getElementById("input-repo");
    const themeSelect = document.getElementById("select-theme");
    const langSelect = document.getElementById("select-lang");
    const codeOutput = document.getElementById("code-output");
    const previewContainer = document.getElementById("preview-container");
    const copyBtn = document.getElementById("copy-btn");

    function updateGenerator() {
      const repo = repoInput.value.trim() || "owner/repo";
      const theme = themeSelect.value;
      const lang = langSelect.value;

      // Generate 1-line script tag
      const snippet = `<script src="${SCRIPT_URL}" data-repo="${repo}" data-theme="${theme}" data-lang="${lang}" async><\/script>`;
      codeOutput.textContent = snippet;

      // Refresh Live Preview
      previewContainer.innerHTML = "";
      const scriptTag = document.createElement("script");
      scriptTag.src = SCRIPT_URL;
      scriptTag.setAttribute("data-repo", repo);
      scriptTag.setAttribute("data-theme", theme);
      scriptTag.setAttribute("data-lang", lang);
      previewContainer.appendChild(scriptTag);
    }

    repoInput.addEventListener("input", updateGenerator);
    themeSelect.addEventListener("change", updateGenerator);
    langSelect.addEventListener("change", updateGenerator);

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(codeOutput.textContent);
      copyBtn.textContent = "Copied!";
      setTimeout(() => copyBtn.textContent = "Copy Code", 2000);
    });

    updateGenerator();
  </script>
</body>
</html>

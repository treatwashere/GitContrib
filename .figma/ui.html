<!DOCTYPE html>
<html>
<head>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- Embeds your live GitContrib website -->
  <iframe src="https://gitcontrib.vercel.app/code/widget.html" id="gitcontrib-frame"></iframe>

  <script>
    // Listen for messages or triggers from your website if you add postMessage handling,
    // or handle import actions directly.
    window.addEventListener('message', (event) => {
      if (event.data && event.data.pluginMessage) {
        parent.postMessage({ pluginMessage: event.data.pluginMessage }, '*');
      }
    });
  </script>
</body>
</html>
